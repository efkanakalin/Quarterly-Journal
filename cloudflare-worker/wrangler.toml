name = "qt-journal-tradovate-proxy"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Production secrets (set via `wrangler secret put`):
#   SUPABASE_JWT_SECRET   # Supabase project settings → API → JWT Secret
#
# OAuth client_id/secret kullanılmaz — kullanıcı Tradovate access token'ını
# manuel paste ediyor; worker sadece CORS proxy.
#
# Optional vars:
[vars]
TRADOVATE_API_BASE = "https://live.tradovateapi.com/v1"
TRADOVATE_DEMO_API_BASE = "https://demo.tradovateapi.com/v1"
ALLOWED_ORIGIN = "https://quarterlyjournal.org"
